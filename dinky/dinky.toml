#:schema https://dinky.rodeo/schemas/dinky.json

start-at-login = true
workspaces = 5
default-layout = 'tiles'
default-tiling = true

[workspace-to-display]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = ['secondary', 'main']

[mouse-follows-focus]
enabled = true

[single-group]
max-width = 1400

[accordion]
padding = 30
orientation = 'keep'

[gaps]
inner = 8
outer = 8

[display.pa32qcv]
gaps.outer.left = 16
gaps.outer.right = 16
gaps.outer.top = 32
gaps.outer.bottom = 32

[borders]
enabled = true
width = 3
active-color = '#fffaf3e6'
inactive-color = '#00000000'
exclude-apps = []

[[rules]]
app-name = '^(?!.*\b(ghostty|chrome)\b).*$'
run = 'layout floating'

[[rules]]
app-id = 'com.google.Chrome'
title = '(devtools|untitled)'
run = 'layout floating'

[[rules]]
app-id = 'com.spotify.client'
run = ['layout floating', 'move-window-to-workspace 5 --follow', 'exec-and-forget open -g "raycast://extensions/raycast/window-management/center"']

[mode.main]
alt-shift-ctrl-t = 'layout tiles horizontal vertical'
alt-shift-ctrl-r = 'layout accordion horizontal vertical'

alt-shift-ctrl-e = 'layout floating tiling'
alt-shift-ctrl-w = 'fullscreen'

alt-shift-ctrl-h = 'focus --wrap-around left'
alt-shift-ctrl-j = 'focus down'
alt-shift-ctrl-k = 'focus up'
alt-shift-ctrl-l = 'focus --wrap-around right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-ctrl-minus = 'resize smart -50'
alt-shift-ctrl-equal = 'resize smart +50'

alt-shift-ctrl-v = 'join-with left'
alt-shift-ctrl-b = 'join-with right'

alt-shift-ctrl-i = 'workspace-back-and-forth'
alt-shift-ctrl-o = 'focus-back-and-forth'

alt-shift-ctrl-a = 'workspace 1'
alt-shift-ctrl-s = 'workspace 2'
alt-shift-ctrl-d = 'workspace 3'
alt-shift-ctrl-f = 'workspace 4'
alt-shift-ctrl-g = 'workspace 5'

alt-shift-a = 'move-window-to-workspace 1 --follow'
alt-shift-s = 'move-window-to-workspace 2 --follow'
alt-shift-d = 'move-window-to-workspace 3 --follow'
alt-shift-f = 'move-window-to-workspace 4 --follow'
alt-shift-g = 'move-window-to-workspace 5 --follow'

alt-shift-semicolon = 'mode service'

[mode.service]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
b = ['reload-config', 'mode main']
